<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Реклама</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #timer {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            user-select: none;
            z-index: 10;
            transition: all 0.3s ease;
        }
        #closeBtn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 24px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
            transition: background 0.2s, transform 0.2s;
            animation: pulse 1.5s ease-in-out infinite;
        }
        #closeBtn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4); }
            50% { box-shadow: 0 4px 40px rgba(76, 175, 80, 0.8); }
        }
        .label {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 10;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="video-wrapper" id="wrapper">
        <!-- видео создаётся динамически из сообщения хаба -->
        <div id="timer"></div>
        <button id="closeBtn">✕ Получить награду</button>
        <div class="label">Реклама</div>
    </div>

    <script>
        const wrapper = document.getElementById('wrapper');
        const timer = document.getElementById('timer');
        const closeBtn = document.getElementById('closeBtn');

        let interval = null;
        let seconds = 10;
        let timerFinished = false;
        let isPlaying = false;
        let rewardData = null;
        let currentVideo = null;

        // Блокируем пробел и ESC, отключаем контекстное меню
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Escape') e.preventDefault();
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Сообщаем хабу, что готовы принимать рекламу
        // (несколько раз на случай, если хаб ещё не повесил обработчик)
        function announceReady(attempt) {
            if (attempt > 5) return;
            window.parent.postMessage({ type: 'adReady' }, '*');
            setTimeout(() => announceReady(attempt + 1), 300);
        }
        announceReady(1);

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;

            if (data.type === 'start' && !isPlaying) {
                rewardData = { typeAd: data.typeAd, tipeGive: data.tipeGive };
                startAd(data.videoUrl || '', data.clickUrl || '');
            }
        });

        function startAd(videoUrl, clickUrl) {
            isPlaying = true;
            timerFinished = false;
            seconds = 10;

            // Убираем видео с прошлой рекламы, если было
            if (currentVideo) {
                currentVideo.pause();
                currentVideo.remove();
                currentVideo = null;
            }

            timer.style.display = 'block';
            timer.textContent = '⏱ ' + seconds;
            closeBtn.style.display = 'none';

            if (videoUrl) {
                currentVideo = document.createElement('video');
                currentVideo.muted = true;
                currentVideo.playsInline = true;
                currentVideo.src = videoUrl;
                currentVideo.addEventListener('click', () => {
                    if (clickUrl) window.open(clickUrl, '_blank');
                });
                currentVideo.addEventListener('ended', () => { if (!timerFinished) finishAd(); });
                currentVideo.addEventListener('error', () => { if (!timerFinished) finishAd(); });
                wrapper.insertBefore(currentVideo, timer);
                currentVideo.play().catch(() => {});
            }

            interval = setInterval(() => {
                seconds--;
                timer.textContent = '⏱ ' + seconds;

                if (seconds <= 0) {
                    clearInterval(interval);
                    interval = null;
                    finishAd();
                }
            }, 1000);
        }

        // Видео закончилось раньше таймера (или не загрузилось)
        function finishAd() {
            if (interval) {
                clearInterval(interval);
                interval = null;
            }
            timerFinished = true;
            timer.style.display = 'none';
            closeBtn.style.display = 'block';
            isPlaying = false;
        }

        closeBtn.onclick = function () {
            window.parent.postMessage({
                type: 'finish',
                typeAd: rewardData ? rewardData.typeAd : null,
                tipeGive: rewardData ? rewardData.tipeGive : null
            }, '*');

            isPlaying = false;
            rewardData = null;
            closeBtn.style.display = 'none';
        };
    </script>
</body>
</html>
