<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Игровой плеер - Хаб</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="playBody">
<div class="top-bar">
    <div class="play-nav-buttons">
        <a href="#" class="nav-btn" id="allGamesLink">🎮 Все игры</a>
        <a href="#" class="nav-btn" id="gameDescLink">📖 Описание игры</a>
    </div>
    <div class="game-title-header" id="gameTitleSpan">Игра</div>
    <a href="#" class="back-link" id="backLink" style="visibility: hidden;">← Назад</a>
</div>

<div class="game-layout">
    <!-- ИГРА -->
    <div class="game-area">
        <iframe id="gameIframe" class="game-frame" src="about:blank" allowfullscreen></iframe>
        <!-- Реклама (поверх игры) -->
        <iframe id="adOverlay" src="ad.html"></iframe>
    </div>

    <!-- БАННЕР СПРАВА (заполняется из script.js) -->
    <div class="ad-sidebar">
        <div class="ad-label">Реклама</div>
        <div class="banner-content">
            <div class="fake-ad">
                🧨 <strong>Ваша реклама</strong><br>
                <span style="font-size:11px;">Текст баннера 300x250</span><br>
                <button onclick="alert('Клик по рекламе (демо)')">Узнать больше</button>
            </div>
        </div>
    </div>
</div>

<script>
    const gameIframe = document.getElementById('gameIframe');
    const adOverlay = document.getElementById('adOverlay');

    let isAdShowing = false;   // реклама сейчас на экране
    let adReady = false;       // ad.html сообщил о готовности
    let pendingAdStart = null; // старт, пришедший до готовности ad.html

    function sendToAd(payload) {
        adOverlay.contentWindow.postMessage(payload, '*');
    }

    window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || !data.type) return;

        // === Сообщения от рекламного iframe ===
        if (event.source === adOverlay.contentWindow) {
            if (data.type === 'adReady') {
                adReady = true;
                if (pendingAdStart) {
                    sendToAd(pendingAdStart);
                    pendingAdStart = null;
                }
            } else if (data.type === 'finish') {
                // Передаём финиш игре и прячем рекламу
                gameIframe.contentWindow.postMessage(data, '*');
                isAdShowing = false;
                adOverlay.style.display = 'none';
            }
            return;
        }

        // === Сообщение от игры ===
        if (event.source === gameIframe.contentWindow &&
            data.type === 'start' && data.typeAd === 'rewarded') {

            if (isAdShowing) {
                console.warn('Реклама уже показывается, игнорирую повторный start');
                return;
            }
            isAdShowing = true;

            const payload = {
                type: 'start',
                typeAd: data.typeAd,
                tipeGive: data.tipeGive,
                videoUrl: window.__adVideoUrl || '',
                clickUrl: window.__adClickUrl || ''
            };

            adOverlay.style.display = 'block';
            if (adReady) sendToAd(payload);
            else pendingAdStart = payload;
        }
    });
</script>

<footer>© by MrDesert v0.0.1.0.0.0 DesertBox - Хаб игр</footer>
<script src="script.js"></script>
</body>
</html>
